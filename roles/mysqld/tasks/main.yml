- name: Install RPM-GPG-KEY-mysql
  rpm_key:
    state: present
    key: https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
  tags: mysqld

- name: Install mysql-repo
  dnf:
    name: "https://repo.mysql.com/mysql84-community-release-el{{ el_major }}-1.noarch.rpm"
    state: present
    disable_gpg_check: yes
  tags: mysqld
  ignore_errors: yes

- name: disable repo
  replace: dest=/etc/yum.repos.d/mysql-community.repo regexp="enabled *= *1" replace="enabled=0"
  tags: mysqld

- name: disable gpgcheck for mysql repo
  replace: dest=/etc/yum.repos.d/mysql-community.repo regexp="gpgcheck *= *1" replace="gpgcheck=0"
  tags: mysqld

- name: Download Mysql packages
  shell: dnf download --resolve --enablerepo=mysql-8.4-lts-community --destdir=/tmp/mysql-rpms {{ packages | join(' ') }}
  args:
    creates: /tmp/mysql-rpms
  tags: mysqld

- name: Install Mysql packages with nosignature
  shell: rpm -Uvh --nosignature /tmp/mysql-rpms/*.rpm
  tags: mysqld
  ignore_errors: yes

- name: MySQL-Python installed
  pip:
    name:
      - PyMySQL
  tags: mysqld

- name: include my.cnf.d
  lineinfile: dest=/etc/my.cnf line="!includedir /etc/my.cnf.d"
  tags: mysqld

- name: create mysql configuration file
  template: src=my.cnf.j2 dest=/etc/my.cnf.d/customize.cnf
  tags: mysqld

- name: exists for /root/.my.cnf
  stat: path=/root/.my.cnf
  register: res
  tags: mysqld

- name: clear passwd
  shell: mysqld --initialize-insecure
  tags: mysqld
  when: not res.stat.exists

- name: start mysql service
  service: name=mysqld state=started enabled=yes
  tags: mysqld

- name: set mysql root password
  shell: mysql --connect-expired-password -uroot --execute="ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql.root.password }}';"
  tags: mysqld
  when: not res.stat.exists

- name: copy .my.cnf file with root password credentials
  template: src=.my.cnf.j2 dest=/root/.my.cnf owner=root mode=0600 force=no
  tags: mysqld
  when: not res.stat.exists

- name: delete anonymous MySQL user
  shell: mysql -uroot -p'{{ mysql.root.password }}' --execute="DELETE FROM mysql.user WHERE User='';"
  tags: mysqld
  ignore_errors: yes

- name: remove the MySQL test database
  shell: mysql -uroot -p'{{ mysql.root.password }}' --execute="DROP DATABASE IF EXISTS test;"
  tags: mysqld

- name: flush privileges
  shell: mysql -uroot -p'{{ mysql.root.password }}' --execute="FLUSH PRIVILEGES;"
  tags: mysqld
