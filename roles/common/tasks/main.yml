- name: installed 'python'
  dnf:
    name: 
      - python-unversioned-command
      - python3-pip
      - python3-cryptography 
      - python3-devel
      - augeas-libs
    state: present
  tags: common

- name: python packaging installed
  shell: pip3 install packaging
  tags: common

- name: python passlib installed
  pip:
    name:
      - passlib
  tags: common

- name: enable CodeReady Builder(CRB) repository via subscription-manager
  command: subscription-manager repos --enable codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-$(arch)-rpms
  tags: common
  when: rhel9 or rhel10
  ignore_errors: yes

- name: enable CodeReady Builder(CRB) repository via dnf
  command: dnf config-manager --set-enabled crb
  tags: common
  when: alma9 or rocky9 or alma10 or rocky10

- name: install the 'epel repositry'
  dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: yes
  tags: common
  when: not al2023

- name: ensure epel enabled
  command: dnf config-manager --set-enabled epel
  tags: common
  when: not al2023

- name: epel 9.x workaround
  replace: dest="/etc/yum.repos.d/epel.repo" regexp="\$releasever" replace="9"
  when: el9
  tags: common

- name: epel 10.x GPG key workaround
  file:
    src: /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-10
    dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-10_major
    state: link
  when: el10
  ignore_errors: yes
  tags: common

- name: install the 'Development tools' package group
  dnf:
    name: "@Development Tools"
    state: present
  tags: common

- name: install the latest libraries
  dnf: name="{{ packages }}" state=present
  tags: common

- name: dnf update
  dnf:
    name: "*"
    state: latest
  tags: common

- name: reinstalled glibc-common
  shell: dnf reinstall -y glibc-common
  tags: common

- name: installed langpack
  dnf: name="glibc-langpack-{{ locale_code }}" state=present
  tags: common

- name: set locale
  command: localectl set-locale LANG={{ locale }} 
  tags: common

- name: set timezone
  command: timedatectl set-timezone {{ zone }}
  tags: common

- name: set path to ldconfig
  template: src=usr_local.conf.j2 dest=/etc/ld.so.conf.d/usr_local.conf
  tags: common

- name: set hostname
  hostname:
    name: "{{ server_hostname }}"
    use: systemd 
  tags: common

- name: rsyslog is runnning and enabled
  service: name=rsyslog state=started enabled=yes
  tags: common
  
- name: create groups
  group: name={{ item }} state=present
  with_items:
    - "{{group.shared}}"
    - "{{group.sftponly}}"
  tags: common
